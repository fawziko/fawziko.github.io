# Render Blueprint. Use this file when CommentDM is the repository root:
# Render: New → Blueprint → connect the repo (Blueprint Path: render.yaml).
# If CommentDM lives in a subdirectory of a larger repo, also add
# `rootDir: <that subdirectory>` under the service below and set the
# Blueprint Path to <subdirectory>/render.yaml.
#
# The disk below keeps SQLite data across deploys. Disks require a paid
# instance type; on the free plan use Render Postgres instead and replace
# DATABASE_URL with its internal connection string.
services:
  - type: web
    name: commentdm
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: commentdm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: INSTAGRAM_GRAPH_VERSION
        value: v23.0
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
